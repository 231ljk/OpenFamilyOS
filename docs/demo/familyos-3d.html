<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FamilyOS Open Wheel · 3D 系统运行界面</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#070b16; font-family:'Roboto','PingFang SC','Segoe UI',Arial,sans-serif; color:#dbe4f0; }
  #stage { position:fixed; inset:0; }
  canvas { display:block; }

  /* HUD 通用 */
  .hud { position:fixed; z-index:10; background:rgba(10,16,32,0.62); border:1px solid rgba(79,209,197,0.22); border-radius:12px; backdrop-filter:blur(6px); box-shadow:0 6px 24px rgba(0,0,0,0.45); }
  .hud-title { font-size:11px; letter-spacing:2px; color:#4FD1C5; padding:8px 12px 4px; border-bottom:1px solid rgba(79,209,197,0.15); font-weight:600; }

  /* 左上：系统信息 */
  #hud-info { left:16px; top:16px; width:230px; }
  #hud-info .row { display:flex; justify-content:space-between; padding:5px 12px; font-size:12px; }
  #hud-info .row .k { color:#7d8ea8; }
  #hud-info .row .v { color:#e8f2ff; font-family:'Consolas','Courier New',monospace; }
  #hud-info .brand { padding:10px 12px 8px; font-size:13px; font-weight:700; color:#fff; letter-spacing:1px; }
  #hud-info .brand span { color:#4FD1C5; }
  #hud-uptime { color:#4FD1C5; font-family:'Consolas',monospace; }

  /* 右上：服务状态 */
  #hud-services { right:16px; top:16px; width:236px; }
  #hud-services .svc { display:flex; align-items:center; justify-content:space-between; padding:6px 12px; font-size:12px; border-bottom:1px solid rgba(255,255,255,0.05); }
  #hud-services .svc .nm { color:#cfe0f5; }
  #hud-services .svc .nm small { color:#64748b; margin-left:4px; }
  #hud-services .svc .st { display:flex; align-items:center; gap:6px; color:#52637a; font-size:11px; }
  #hud-services .svc .dot { width:8px; height:8px; border-radius:50%; background:#3a4a63; }
  #hud-services .svc.up .dot { background:#52C41A; box-shadow:0 0 8px rgba(82,196,26,0.9); }
  #hud-services .svc.up .st { color:#52C41A; }
  #hud-services .foot { padding:7px 12px; font-size:11px; color:#7d8ea8; text-align:center; }

  /* 左下：启动日志 */
  #hud-log { left:16px; bottom:16px; width:420px; max-height:240px; }
  #hud-log .body { padding:8px 12px 10px; font-family:'Consolas','Courier New',monospace; font-size:11.5px; line-height:1.75; height:190px; overflow:hidden; }
  #hud-log .ln { color:#7d8ea8; }
  #hud-log .ln.t { color:#e8f2ff; }
  #hud-log .ln.ok { color:#52C41A; }
  #hud-log .ln.warn { color:#FAAD14; }
  #hud-log .ln.done { color:#4FD1C5; font-weight:700; }

  /* 底部：操作提示 */
  #hud-foot { left:50%; transform:translateX(-50%); bottom:16px; padding:8px 18px; font-size:11.5px; color:#7d8ea8; background:rgba(10,16,32,0.5); border:1px solid rgba(79,209,197,0.12); border-radius:999px; backdrop-filter:blur(4px); }
  #hud-foot b { color:#4FD1C5; font-weight:600; }

  /* 加载失败提示 */
  #fail { position:fixed; inset:0; z-index:99; display:none; align-items:center; justify-content:center; background:#070b16; color:#e8f2ff; font-size:14px; text-align:center; line-height:2; }
  #fail a { color:#4FD1C5; }

  @media (max-width:640px) {
    #hud-info { width:178px; left:10px; top:10px; }
    #hud-info .row { font-size:10.5px; padding:4px 8px; }
    #hud-services { right:10px; top:10px; width:172px; }
    #hud-services .svc { padding:5px 8px; font-size:10.5px; }
    #hud-log { left:10px; bottom:10px; width:calc(100vw - 20px); max-height:170px; }
    #hud-log .body { height:120px; font-size:10px; }
    #hud-foot { display:none; }
  }
</style>
</head>
<body>
<div id="stage"></div>

<div id="hud-info" class="hud">
  <div class="brand">FAMILY<span>OS</span> · 开轮版</div>
  <div class="row"><span class="k">版本</span><span class="v">0.1.0</span></div>
  <div class="row"><span class="k">内核</span><span class="v">Linux 6.6.157</span></div>
  <div class="row"><span class="k">用户态</span><span class="v">busybox 1.37.0</span></div>
  <div class="row"><span class="k">架构</span><span class="v">x86_64</span></div>
  <div class="row"><span class="k">运行时间</span><span id="hud-uptime">00:00:00</span></div>
</div>

<div id="hud-services" class="hud">
  <div class="hud-title">SYSTEM SERVICES</div>
  <div id="svc-list"></div>
  <div class="foot" id="svc-foot">引导中…</div>
</div>

<div id="hud-log" class="hud">
  <div class="hud-title">BOOT LOG · /dev/kmsg</div>
  <div class="body" id="log-body"></div>
</div>

<div id="hud-foot">🖱️ 拖拽旋转视角 · 滚轮缩放 · 点击空白重置</div>
<div id="fail">3D 渲染库加载失败<br>请检查网络后刷新（依赖 jsDelivr CDN）<br><a href="#" onclick="location.reload()">重新加载</a></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

/* ---------------- 数据 ---------------- */
const SERVICES = [
  { id:'super-ring',  name:'超级环',  en:'Super Ring',  color:0x4FD1C5, desc:'核心 IPC 总线' },
  { id:'ai-bus',      name:'AI 总线',  en:'AI Bus',      color:0x9EACEA, desc:'模型调度' },
  { id:'home-bridge', name:'家庭桥',   en:'Home Bridge', color:0xF4B393, desc:'设备互联' },
  { id:'voice',       name:'语音',     en:'Voice',       color:0xA3D5E8, desc:'语音交互' },
  { id:'virt-compat', name:'兼容层',   en:'Virt Compat', color:0x94D8C3, desc:'虚拟化适配' },
  { id:'migration',   name:'迁移',     en:'Migration',   color:0xE4D48F, desc:'热迁移' },
  { id:'health',      name:'健康',     en:'Health',      color:0xA2DDAA, desc:'系统监控' },
];

const LOG_LINES = [
  ['t','[0.000] FamilyOS Open Wheel Edition 0.1.0 (x86_64) 引导开始'],
  ['t','[0.312] Linux 6.6.157 内核解压完成 · initramfs 加载'],
  ['t','[0.618] 挂载 devtmpfs→/dev · proc→/proc · sysfs→/sys'],
  ['ok','[1.024] insmod super_ring.ko   超级环核心模块 OK'],
  ['ok','[1.105] insmod health_usage.ko 健康统计模块 OK'],
  ['t','[1.432] 启动 super-ring 守护进程 → /run/fos/super-ring.sock'],
  ['t','[1.521] 启动 ai-bus 守护进程 → /run/fos/ai-bus.sock'],
  ['t','[1.633] 启动 home-bridge 守护进程 → /run/fos/home-bridge.sock'],
  ['t','[1.710] 启动 voice 守护进程 → /run/fos/voice.sock'],
  ['t','[1.805] 启动 virt-compat 守护进程 → /run/fos/virt-compat.sock'],
  ['t','[1.902] 启动 migration 守护进程 → /run/fos/migration.sock'],
  ['t','[1.977] 启动 health 守护进程 → /run/fos/health.sock'],
  ['ok','[2.103] 7/7 服务就绪 · IPC 总线建立'],
  ['done','[2.315] SYSTEM NORMAL — 控制台就绪（/dev/console）'],
];

/* ---------------- 场景 ---------------- */
const stage = document.getElementById('stage');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070b16);
scene.fog = new THREE.FogExp2(0x070b16, 0.016);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(9.5, 6.5, 12.5);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = false;
stage.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.style.position = 'absolute';
labelRenderer.domElement.style.top = '0';
labelRenderer.domElement.style.pointerEvents = 'none';
stage.appendChild(labelRenderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.minDistance = 5;
controls.maxDistance = 40;

/* 灯光 */
scene.add(new THREE.AmbientLight(0x33415c, 1.0));
const dir = new THREE.DirectionalLight(0xbfe9ff, 1.2);
dir.position.set(8, 12, 6);
scene.add(dir);
const coreLight = new THREE.PointLight(0x4FD1C5, 2.2, 30);
coreLight.position.set(0, 0, 0);
scene.add(coreLight);
const rim = new THREE.PointLight(0x2b5bd7, 0.8, 40);
rim.position.set(-10, -4, -8);
scene.add(rim);

/* 星尘背景 */
const stars = new THREE.Points(
  new THREE.BufferGeometry().setFromPoints(
    Array.from({length:1200}, () => new THREE.Vector3(
      (Math.random()-0.5)*90, (Math.random()-0.5)*90, (Math.random()-0.5)*90))),
  new THREE.PointsMaterial({ color:0x8fa8cc, size:0.09, transparent:true, opacity:0.7 })
);
scene.add(stars);

/* 地面网格 */
const grid = new THREE.GridHelper(34, 26, 0x1d2b45, 0x14202f);
grid.position.y = -4.4;
scene.add(grid);

/* ---------------- 中央核心 ---------------- */
const coreGroup = new THREE.Group();
scene.add(coreGroup);

const coreSphere = new THREE.Mesh(
  new THREE.SphereGeometry(1.55, 48, 48),
  new THREE.MeshPhongMaterial({ color:0x1d3a52, emissive:0x0e2f4d, transparent:true, opacity:0.92, shininess:90 })
);
coreGroup.add(coreSphere);

const coreGlow = new THREE.Mesh(
  new THREE.SphereGeometry(1.85, 32, 32),
  new THREE.MeshBasicMaterial({ color:0x2aa8c8, transparent:true, opacity:0.14 })
);
coreGroup.add(coreGlow);

const ringGeo = new THREE.TorusGeometry(2.6, 0.045, 16, 120);
const ringMat = new THREE.MeshBasicMaterial({ color:0x4FD1C5, transparent:true, opacity:0.55 });
const ringA = new THREE.Mesh(ringGeo, ringMat);
ringA.rotation.x = Math.PI/2.15;
const ringB = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color:0x2b6cff, transparent:true, opacity:0.4 }));
ringB.rotation.x = Math.PI/1.8; ringB.rotation.y = Math.PI/4;
ringB.scale.set(1.18, 1.18, 1.18);
coreGroup.add(ringA, ringB);

/* 内部旋转能量环 */
const innerRing = new THREE.Mesh(
  new THREE.TorusGeometry(2.05, 0.02, 8, 90),
  new THREE.MeshBasicMaterial({ color:0x9be8ff, transparent:true, opacity:0.7 })
);
innerRing.rotation.x = Math.PI/2.5;
coreGroup.add(innerRing);

/* 核心标签 */
const coreLabel = makeLabel('<b style="font-size:15px;color:#4FD1C5;">FOS KERNEL</b><br><span style="font-size:11px;color:#7d8ea8;">super_ring + health_usage</span>');
coreLabel.position.y = 3.6;
coreGroup.add(coreLabel);

/* ---------------- 服务节点 ---------------- */
const nodes = [];
const links = [];
const streams = [];
const N = SERVICES.length;

SERVICES.forEach((s, i) => {
  const angle = (i / N) * Math.PI * 2 - Math.PI / 2;
  const r = 6.6;
  const y = Math.sin(i * 1.7) * 1.4;
  const pos = new THREE.Vector3(Math.cos(angle) * r, y, Math.sin(angle) * r);

  /* 节点球 */
  const node = new THREE.Group();
  const ball = new THREE.Mesh(
    new THREE.SphereGeometry(0.34, 24, 24),
    new THREE.MeshPhongMaterial({ color:s.color, emissive:s.color, emissiveIntensity:0.55, shininess:70 })
  );
  const halo = new THREE.Mesh(
    new THREE.SphereGeometry(0.55, 16, 16),
    new THREE.MeshBasicMaterial({ color:s.color, transparent:true, opacity:0.13 })
  );
  node.add(ball, halo);
  node.position.copy(pos);
  scene.add(node);

  /* 标签 */
  const label = makeLabel(
    '<div style="text-align:center;">' +
    '<div style="font-size:13px;font-weight:700;color:#e8f2ff;">' + s.name + '</div>' +
    '<div style="font-size:9.5px;color:#64748b;letter-spacing:1px;">' + s.en.toUpperCase() + '</div>' +
    '<div style="font-size:10px;color:#4FD1C5;margin-top:2px;">' + s.desc + '</div></div>');
  label.position.set(0, 1.35, 0);
  node.add(label);

  nodes.push({ def:s, group:node, basePos:pos, angle, y, phase: Math.random()*Math.PI*2 });

  /* 核心 → 节点连线 */
  const line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), pos]),
    new THREE.LineBasicMaterial({ color:s.color, transparent:true, opacity:0.28 })
  );
  scene.add(line);
  links.push({ line, to:pos, color:s.color });

  /* 数据流粒子：核心 → 服务 */
  const P = 5;
  const pts = new THREE.Points(
    new THREE.BufferGeometry().setFromPoints(Array.from({length:P}, () => new THREE.Vector3())),
    new THREE.PointsMaterial({ color:s.color, size:0.14, transparent:true, opacity:0.95 })
  );
  scene.add(pts);
  streams.push({ pts, P, to:pos, color:s.color, off: Math.random() });
});

/* CSS2D 标签工厂 */
function makeLabel(html) {
  const el = document.createElement('div');
  el.innerHTML = html;
  el.style.textShadow = '0 2px 12px rgba(0,0,0,0.8)';
  const obj = new CSS2DObject(el);
  return obj;
}

/* ---------------- HUD：服务列表 ---------------- */
const svcList = document.getElementById('svc-list');
const svcRows = SERVICES.map(s => {
  const row = document.createElement('div');
  row.className = 'svc';
  row.innerHTML = '<span class="nm">' + s.name + '<small>' + s.en + '</small></span>' +
                  '<span class="st"><span class="dot"></span>BOOT</span>';
  svcList.appendChild(row);
  return { row, dot:row.querySelector('.dot'), st:row.querySelector('.st') };
});

/* ---------------- HUD：日志 ---------------- */
const logBody = document.getElementById('log-body');
let logIdx = 0;
function pushLog(kind, text) {
  const d = document.createElement('div');
  d.className = 'ln ' + kind;
  d.textContent = text;
  logBody.appendChild(d);
  while (logBody.children.length > 11) logBody.removeChild(logBody.firstChild);
  logBody.scrollTop = logBody.scrollHeight;
}

/* ---------------- 启动序列 ---------------- */
const bootT0 = performance.now();
function bootTick(now) {
  const t = (now - bootT0) / 1000;
  while (logIdx < LOG_LINES.length && parseFloat(LOG_LINES[logIdx][1].slice(1,7)) <= t) {
    const [kind, text] = LOG_LINES[logIdx];
    pushLog(kind, text);
    if (kind === 't' && logIdx >= 4) {
      /* 第 4 行起按序点亮服务（模块先行） */
      const svcIdx = Math.min(logIdx - 4, N - 1);
      if (svcIdx >= 0 && svcIdx < N) setSvcUp(svcIdx);
    }
    logIdx++;
  }
  if (logIdx >= LOG_LINES.length) {
    document.getElementById('svc-foot').textContent = '7/7 RUNNING · SYSTEM NORMAL';
  }
}
function setSvcUp(i) {
  const r = svcRows[i];
  r.row.classList.add('up');
  r.st.innerHTML = '<span class="dot"></span>RUN';
}

/* ---------------- 运行时间 ---------------- */
const bootTime = Date.now();
function tickUptime() {
  const s = Math.floor((Date.now() - bootTime) / 1000);
  const h = String(Math.floor(s/3600)).padStart(2,'0');
  const m = String(Math.floor((s%3600)/60)).padStart(2,'0');
  const sec = String(s%60).padStart(2,'0');
  document.getElementById('hud-uptime').textContent = h + ':' + m + ':' + sec;
}

/* ---------------- 动画 ---------------- */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const now = performance.now();

  /* 核心自转与环旋转 */
  coreSphere.rotation.y += dt * 0.25;
  innerRing.rotation.y += dt * 0.5;
  innerRing.rotation.z += dt * 0.22;
  ringA.rotation.z += dt * 0.18;
  ringB.rotation.z -= dt * 0.14;

  /* 服务节点悬浮 + 公转 */
  nodes.forEach((nd, i) => {
    nd.phase += dt * (0.6 + i * 0.04);
    nd.group.position.x = Math.cos(nd.angle) * nd.basePos.length() * 0.985;
    nd.group.position.z = Math.sin(nd.angle) * nd.basePos.length() * 0.985;
    nd.group.position.y = nd.y + Math.sin(nd.phase) * 0.25;
    nd.group.rotation.y += dt * 0.8;
    links[i].line.geometry.setFromPoints([new THREE.Vector3(0,0,0), nd.group.position]);
    links[i].line.geometry.computeBoundingSphere();
    streams[i].to.copy(nd.group.position);
  });

  /* 数据流粒子沿核心→节点流动 */
  streams.forEach(st => {
    st.off = (st.off + dt * 0.16) % 1;
    const pos = st.pts.geometry.attributes.position;
    for (let p = 0; p < st.P; p++) {
      const f = ((p / st.P) + st.off) % 1;
      pos.setXYZ(p,
        st.to.x * f * f * (3 - 2 * f) * 0.92,
        st.to.y * f * f * (3 - 2 * f) * 0.92,
        st.to.z * f * f * (3 - 2 * f) * 0.92);
    }
    pos.needsUpdate = true;
  });

  /* 星尘缓转 */
  stars.rotation.y += dt * 0.008;

  bootTick(now);
  tickUptime();
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

/* ---------------- resize ---------------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
});

/* 点击空白处重置视角 */
renderer.domElement.addEventListener('pointerdown', (e) => {
  if (e.target === renderer.domElement) {
    controls.autoRotate = !controls.autoRotate;
  }
});

/* 加载失败兜底 */
window.addEventListener('error', (e) => {
  if (e.message && e.message.indexOf('import') !== -1) {
    document.getElementById('fail').style.display = 'flex';
  }
}, true);

animate();
</script>
</body>
</html>
