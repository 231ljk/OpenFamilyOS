<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FamilyOS Open Wheel · 3D 模型手机</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#070b16; font-family:'Roboto','PingFang SC','Segoe UI',Arial,sans-serif; color:#dbe4f0; }
  #stage { position:fixed; inset:0; }
  canvas { display:block; }

  #hud { position:fixed; left:50%; transform:translateX(-50%); bottom:18px; z-index:10; padding:9px 20px; background:rgba(10,16,32,0.62); border:1px solid rgba(79,209,197,0.2); border-radius:999px; backdrop-filter:blur(6px); font-size:12px; color:#8ea3c0; white-space:nowrap; }
  #hud b { color:#4FD1C5; font-weight:600; }

  #brand { position:fixed; left:18px; top:18px; z-index:10; font-size:13px; font-weight:700; letter-spacing:1px; color:#fff; text-shadow:0 2px 10px rgba(0,0,0,0.6); }
  #brand span { color:#4FD1C5; }
  #brand small { display:block; font-size:10px; color:#64748b; font-weight:400; letter-spacing:2px; margin-top:2px; }

  #fail { position:fixed; inset:0; z-index:99; display:none; align-items:center; justify-content:center; background:#070b16; color:#e8f2ff; font-size:14px; text-align:center; line-height:2.2; }
  #fail a { color:#4FD1C5; }

  #loading { position:fixed; inset:0; z-index:98; display:flex; align-items:center; justify-content:center; background:#070b16; color:#8ea3c0; font-size:13px; letter-spacing:2px; }
  @media (max-width:640px) { #hud { font-size:10.5px; padding:7px 12px; bottom:12px; } #brand { left:12px; top:12px; } }
</style>
</head>
<body>
<div id="loading">加载 3D 模型手机…</div>
<div id="stage"></div>
<div id="brand">FAMILY<span>OS</span> · 开轮版<small>MODEL PHONE · x86_64</small></div>
<div id="hud">🖱️ 拖拽旋转 · 滚轮缩放 · <b>点击屏幕</b>解锁 / 打开应用 / 返回</div>
<div id="fail">3D 渲染库加载失败（依赖 jsDelivr CDN）<br><a href="#" onclick="location.reload()">重新加载</a></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

document.getElementById('loading').style.display = 'none';

/* ================= 数据 ================= */
const APPS = [
  { id:'super-ring',  name:'超级环', en:'Super Ring',  color:'#4FD1C5', desc:'核心 IPC 总线',   path:'/run/fos/super-ring.sock',  icon:'◎' },
  { id:'ai-bus',      name:'AI 总线', en:'AI Bus',      color:'#9EACEA', desc:'模型调度引擎',   path:'/run/fos/ai-bus.sock',      icon:'◈' },
  { id:'home-bridge', name:'家庭桥', en:'Home Bridge', color:'#F4B393', desc:'智能设备互联',   path:'/run/fos/home-bridge.sock', icon:'⌂' },
  { id:'voice',       name:'语音',   en:'Voice',       color:'#A3D5E8', desc:'语音交互助手',   path:'/run/fos/voice.sock',       icon:'♫' },
  { id:'virt-compat', name:'兼容层', en:'Virt Compat', color:'#94D8C3', desc:'虚拟化与适配',   path:'/run/fos/virt-compat.sock', icon:'▣' },
  { id:'migration',   name:'迁移',   en:'Migration',   color:'#E4D48F', desc:'数据热迁移',     path:'/run/fos/migration.sock',   icon:'⇄' },
  { id:'health',      name:'健康',   en:'Health',      color:'#A2DDAA', desc:'系统健康监控',   path:'/run/fos/health.sock',      icon:'♥' },
  { id:'settings',    name:'设置',   en:'Settings',    color:'#8BC8EA', desc:'系统与版本信息', path:'内置',                        icon:'⚙' },
];
const DOCK_IDS = ['super-ring', 'ai-bus', 'settings'];
const SW = 540, SH = 960;           /* 屏幕逻辑分辨率 */
const STATE = { mode:'LOCKED', app:null };

/* 服务状态（模拟系统正常态） */
const SYS = {
  ver:'0.1.0', kernel:'Linux 6.6.157', busybox:'busybox 1.37.0', arch:'x86_64',
  modules:['super_ring.ko','health_usage.ko'], services: APPS.length - 1, up:'7/7 RUNNING'
};

/* ================= 场景 ================= */
const stage = document.getElementById('stage');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070b16);
scene.fog = new THREE.FogExp2(0x070b16, 0.012);

const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 2.4, 8.6);
camera.lookAt(0, 0.9, 0);

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
stage.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.minDistance = 4; controls.maxDistance = 24;
controls.target.set(0, 1.1, 0);

/* 灯光 */
scene.add(new THREE.AmbientLight(0x33415c, 1.1));
const key = new THREE.DirectionalLight(0xcfe9ff, 1.6); key.position.set(5, 9, 6); scene.add(key);
const fill = new THREE.DirectionalLight(0x2b5bd7, 0.6); fill.position.set(-6, 3, -5); scene.add(fill);
const rimL = new THREE.PointLight(0x4FD1C5, 1.4, 20); rimL.position.set(0, 5, 4); scene.add(rimL);
const glowL = new THREE.PointLight(0x1e5aa8, 0.9, 20); glowL.position.set(0, 0.5, 2.5); scene.add(glowL);

/* 星尘背景 */
scene.add(new THREE.Points(
  new THREE.BufferGeometry().setFromPoints(Array.from({length:900}, () => new THREE.Vector3(
    (Math.random()-0.5)*80, (Math.random()-0.5)*80, (Math.random()-0.5)*80))),
  new THREE.PointsMaterial({ color:0x8fa8cc, size:0.08, transparent:true, opacity:0.65 })
));

/* ================= 手机模型 ================= */
const phone = new THREE.Group();

/* 机身 */
const body = new THREE.Mesh(
  new RoundedBoxGeometry(2.5, 5.15, 0.46, 0.16, 4),
  new THREE.MeshStandardMaterial({ color:0x0d1526, metalness:0.85, roughness:0.32 })
);
phone.add(body);

/* 边框高光条 */
const frame = new THREE.Mesh(
  new RoundedBoxGeometry(2.42, 5.07, 0.34, 0.12, 3),
  new THREE.MeshStandardMaterial({ color:0x273c5c, metalness:0.9, roughness:0.25 })
);
phone.add(frame);

/* 屏幕 */
const SCREEN_W = 2.3, SCREEN_H = 4.86;
const screenTex = new THREE.CanvasTexture(document.createElement('canvas'));
screenTex.colorSpace = THREE.SRGBColorSpace;
const screenMat = new THREE.MeshBasicMaterial({ map:screenTex });
const screen = new THREE.Mesh(new THREE.PlaneGeometry(SCREEN_W, SCREEN_H), screenMat);
screen.position.z = 0.24;
phone.add(screen);

/* 刘海摄像头 + 听筒 */
const notch = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.16, 0.02), new THREE.MeshBasicMaterial({ color:0x02060d }));
notch.position.set(0, 2.12, 0.245);
phone.add(notch);
const camLens = new THREE.Mesh(
  new THREE.CircleGeometry(0.055, 24),
  new THREE.MeshBasicMaterial({ color:0x101c30 })
);
camLens.position.set(-0.18, 2.09, 0.255); phone.add(camLens);
const camLens2 = camLens.clone(); camLens2.position.x = 0.18; phone.add(camLens2);

/* 侧键 */
const btn = (x, y, z, w, h) => { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.05), new THREE.MeshStandardMaterial({ color:0x1b2a44, metalness:0.8, roughness:0.4 })); b.position.set(x, y, z); phone.add(b); };
btn(-1.28, 1.1, 0, 0.05, 0.5);   /* 音量- */
btn(-1.28, 1.6, 0, 0.05, 0.5);   /* 音量+ */
btn(1.28, 0.2, 0, 0.05, 0.85);   /* 电源 */

/* 背面 logo 纹理 */
const backCv = document.createElement('canvas'); backCv.width = 320; backCv.height = 520;
const bctx = backCv.getContext('2d');
bctx.fillStyle = '#0d1526'; bctx.fillRect(0, 0, 320, 520);
bctx.strokeStyle = 'rgba(79,209,197,0.75)'; bctx.lineWidth = 3;
bctx.beginPath(); bctx.arc(160, 170, 42, 0, Math.PI*2); bctx.stroke();
bctx.beginPath(); bctx.arc(160, 170, 26, 0, Math.PI*2); bctx.stroke();
bctx.fillStyle = '#4FD1C5'; bctx.font = '600 30px "PingFang SC","Segoe UI",sans-serif';
bctx.textAlign = 'center';
bctx.fillText('FamilyOS', 160, 260);
bctx.fillStyle = '#64748b'; bctx.font = '16px "PingFang SC",sans-serif';
bctx.fillText('开轮版 · OPEN WHEEL', 160, 296);
bctx.fillStyle = '#3a4a63'; bctx.font = '12px monospace';
bctx.fillText('Linux 6.6.157 · x86_64', 160, 470);
const backTex = new THREE.CanvasTexture(backCv); backTex.colorSpace = THREE.SRGBColorSpace;
const back = new THREE.Mesh(new THREE.PlaneGeometry(2.3, 4.7), new THREE.MeshBasicMaterial({ map:backTex }));
back.position.z = -0.245; back.rotation.y = Math.PI;
phone.add(back);

phone.position.y = 1.15;
scene.add(phone);

/* ================= 屏幕绘制 ================= */
const cv = screenTex.image; cv.width = SW; cv.height = SH;
const g = cv.getContext('2d');

function roundRect(x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x+r, y); g.arcTo(x+w, y, x+w, y+h, r); g.arcTo(x+w, y+h, x, y+h, r);
  g.arcTo(x, y+h, x, y, r); g.arcTo(x, y, x+w, y, r); g.closePath();
}

function drawWallpaper() {
  const grad = g.createLinearGradient(0, 0, 0, SH);
  grad.addColorStop(0, '#0b1220'); grad.addColorStop(0.55, '#101c33'); grad.addColorStop(1, '#0a1426');
  g.fillStyle = grad; g.fillRect(0, 0, SW, SH);
  /* 星点 */
  for (let i = 0; i < 40; i++) {
    g.fillStyle = 'rgba(200,225,255,' + (0.05 + Math.random()*0.12) + ')';
    g.beginPath(); g.arc(Math.random()*SW, Math.random()*SH, Math.random()*1.4 + 0.3, 0, Math.PI*2); g.fill();
  }
  /* 品牌水印 */
  g.fillStyle = 'rgba(79,209,197,0.07)'; g.font = '600 46px "PingFang SC",sans-serif'; g.textAlign = 'center';
  g.fillText('FamilyOS · 开轮版', SW/2, SH*0.44);
}

function drawStatusBar(t) {
  g.fillStyle = 'rgba(6,10,20,0.42)'; g.fillRect(0, 0, SW, 30);
  g.fillStyle = '#e8f2ff'; g.font = '600 15px "PingFang SC",sans-serif';
  g.textAlign = 'left'; g.fillText(t || '09:41', 16, 21);
  /* 信号 */
  g.fillStyle = '#e8f2ff';
  for (let i = 0; i < 4; i++) g.fillRect(SW-64 + i*6, 12 + (3-i)*2.2, 4, 8 + i*2.2 - 6);
  /* 电池 */
  g.strokeStyle = '#e8f2ff'; g.lineWidth = 1.4;
  g.strokeRect(SW-42, 11, 24, 11);
  g.fillRect(SW-40, 13, 17, 7);
  g.fillRect(SW-17.5, 14, 2, 5);
}

function timeStr() {
  const d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function dateStr() {
  const d = new Date();
  const w = ['日','一','二','三','四','五','六'][d.getDay()];
  return d.getMonth()+1 + '月' + d.getDate() + '日 星期' + w;
}

function drawAppIcon(x, y, size, app, label) {
  g.save();
  /* 圆角图标底 */
  roundRect(x, y, size, size, size*0.24);
  g.fillStyle = 'rgba(255,255,255,0.06)';
  g.fill();
  g.strokeStyle = app.color + '88'; g.lineWidth = 1.5; g.stroke();
  /* 图标符号 */
  g.fillStyle = app.color; g.font = '600 ' + (size*0.44) + 'px "Segoe UI",sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(app.icon, x + size/2, y + size*0.42);
  /* 名字 */
  g.fillStyle = '#dbe4f0'; g.font = '13px "PingFang SC",sans-serif';
  g.fillText(label || app.name, x + size/2, y + size + 17);
  g.textBaseline = 'alphabetic';
  g.restore();
}

function drawLock() {
  drawWallpaper();
  drawStatusBar();
  g.fillStyle = '#e8f2ff'; g.font = '700 84px "PingFang SC",sans-serif'; g.textAlign = 'center';
  g.fillText(timeStr(), SW/2, SH*0.40);
  g.fillStyle = '#8ea3c0'; g.font = '18px "PingFang SC",sans-serif';
  g.fillText(dateStr(), SW/2, SH*0.40 + 40);
  g.fillStyle = '#4FD1C5'; g.font = '15px "PingFang SC",sans-serif';
  g.fillText('点击屏幕解锁 · FamilyOS 0.1.0', SW/2, SH*0.60);
  /* 解锁条 */
  roundRect(SW/2 - 60, SH*0.86 - 4, 120, 8, 4); g.fillStyle = 'rgba(232,242,255,0.7)'; g.fill();
}

function drawDesktop() {
  drawWallpaper();
  drawStatusBar(timeStr());
  /* 时钟 widget */
  g.fillStyle = '#e8f2ff'; g.font = '700 58px "PingFang SC",sans-serif'; g.textAlign = 'center';
  g.fillText(timeStr(), SW/2, 118);
  g.fillStyle = '#8ea3c0'; g.font = '15px "PingFang SC",sans-serif';
  g.fillText(dateStr(), SW/2, 146);
  /* App 网格 3 列 */
  const colW = 150, colH = 132, gap = 14, x0 = 22, y0 = 180;
  APPS.forEach((a, i) => {
    const col = i % 3, row = Math.floor(i / 3);
    drawAppIcon(x0 + col*(colW+gap), y0 + row*(colH+gap), 92, a);
  });
  /* Dock */
  g.fillStyle = 'rgba(255,255,255,0.05)';
  roundRect(14, SH-118, SW-28, 92, 22); g.fill();
  DOCK_IDS.forEach((id, i) => {
    const a = APPS.find(x => x.id === id);
    const dsize = 74, dx = SW/2 - (DOCK_IDS.length*74 + 2*22)/2 + i*(74+22);
    drawAppIcon(dx, SH-112, dsize, a);
  });
}

function drawAppPage(app) {
  drawWallpaper();
  /* 顶栏 */
  g.fillStyle = 'rgba(6,10,20,0.5)'; g.fillRect(0, 0, SW, 64);
  g.fillStyle = '#e8f2ff'; g.font = '26px "PingFang SC",sans-serif'; g.textAlign = 'left';
  g.fillText('‹', 22, 42);                    /* 返回 */
  g.textAlign = 'center'; g.font = '600 20px "PingFang SC",sans-serif';
  g.fillText(app.name, SW/2, 42);
  g.fillStyle = '#8ea3c0'; g.font = '12px sans-serif';
  g.fillText(app.en.toUpperCase(), SW/2, 58);
  /* 大图标 */
  const bx = SW/2 - 70, by = 150;
  roundRect(bx, by, 140, 140, 34); g.fillStyle = app.color + '2e'; g.fill();
  g.strokeStyle = app.color; g.lineWidth = 2; g.stroke();
  g.fillStyle = app.color; g.font = '700 62px "Segoe UI",sans-serif'; g.textAlign = 'center';
  g.fillText(app.icon, SW/2, by + 88);
  /* 标题 */
  g.fillStyle = '#e8f2ff'; g.font = '700 30px "PingFang SC",sans-serif';
  g.fillText(app.name, SW/2, 340);
  g.fillStyle = '#64748b'; g.font = '14px sans-serif';
  g.fillText(app.en.toUpperCase(), SW/2, 366);
  /* 状态徽标 */
  const badge = app.id === 'settings' ? 'SYSTEM' : 'RUNNING';
  roundRect(SW/2 - 52, 396, 104, 30, 15);
  g.fillStyle = app.id === 'settings' ? 'rgba(139,200,234,0.18)' : 'rgba(82,196,26,0.16)'; g.fill();
  g.strokeStyle = app.id === 'settings' ? '#8BC8EA' : '#52C41A'; g.lineWidth = 1.4; g.stroke();
  g.fillStyle = app.id === 'settings' ? '#8BC8EA' : '#52C41A';
  g.font = '600 14px monospace'; g.fillText(badge, SW/2, 416);
  /* 信息卡 */
  const rows = app.id === 'settings'
    ? [['系统版本', SYS.ver], ['内核', SYS.kernel], ['用户态', SYS.busybox], ['架构', SYS.arch], ['服务状态', SYS.up], ['内核模块', SYS.modules.join(' + ')]]
    : [['功能', app.desc], ['IPC Socket', app.path], ['守护进程', 'fos-' + app.id + '-d'], ['状态', 'ACTIVE · NORMAL']];
  let ry = 460;
  rows.forEach(r => {
    roundRect(28, ry, SW-56, 54, 14);
    g.fillStyle = 'rgba(255,255,255,0.045)'; g.fill();
    g.strokeStyle = 'rgba(255,255,255,0.08)'; g.lineWidth = 1; g.stroke();
    g.fillStyle = '#64748b'; g.font = '13px "PingFang SC",sans-serif'; g.textAlign = 'left';
    g.fillText(r[0], 46, ry + 32);
    g.textAlign = 'right';
    g.fillStyle = '#dbe4f0'; g.font = '14px "Consolas","PingFang SC",monospace';
    g.fillText(r[1], SW-46, ry + 32);
    ry += 66;
  });
  /* Home 指示条 */
  g.fillStyle = 'rgba(232,242,255,0.65)';
  roundRect(SW/2 - 40, SH-14, 80, 5, 3); g.fill();
}

function renderScreen() {
  if (STATE.mode === 'LOCKED') drawLock();
  else if (STATE.mode === 'APP' && STATE.app) drawAppPage(STATE.app);
  else drawDesktop();
  screenTex.needsUpdate = true;
}

/* ================= 交互 ================= */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let lastTap = 0;

renderer.domElement.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObject(screen, false)[0];
  if (!hit || !hit.uv) return;
  const px = hit.uv.x * SW, py = (1 - hit.uv.y) * SH;
  handleTap(px, py);
});

function inRect(x, y, r) { return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h; }

function handleTap(px, py) {
  const now = Date.now();
  if (now - lastTap < 120) return; lastTap = now;

  if (STATE.mode === 'LOCKED') {        /* 点击解锁 */
    STATE.mode = 'DESKTOP'; renderScreen(); return;
  }
  if (STATE.mode === 'APP') {
    if (py < 64 && px < 70) {           /* 返回 */
      STATE.mode = 'DESKTOP'; renderScreen(); return;
    }
    if (py > SH - 34) {                 /* Home 条 */
      STATE.mode = 'DESKTOP'; renderScreen(); return;
    }
    return;
  }
  /* DESKTOP：主区网格 */
  const colW = 150, colH = 132, gap = 14, x0 = 22, y0 = 180;
  for (let i = 0; i < APPS.length; i++) {
    const col = i % 3, row = Math.floor(i / 3);
    const r = { x: x0 + col*(colW+gap), y: y0 + row*(colH+gap), w: 92, h: 92 };
    if (inRect(px, py, r)) { STATE.mode = 'APP'; STATE.app = APPS[i]; renderScreen(); return; }
  }
  /* Dock */
  DOCK_IDS.forEach((id, i) => {
    const dsize = 74, dx = SW/2 - (DOCK_IDS.length*74 + 2*22)/2 + i*(74+22);
    if (inRect(px, py, { x:dx, y:SH-112, w:dsize, h:dsize })) {
      const a = APPS.find(x => x.id === id);
      STATE.mode = 'APP'; STATE.app = a; renderScreen();
    }
  });
}

/* ================= 动画 ================= */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  /* 手机悬浮 + 轻微呼吸 */
  phone.position.y = 1.15 + Math.sin(t * 0.7) * 0.06;
  phone.rotation.y = Math.sin(t * 0.22) * 0.12;   /* 缓慢摆动展示 */
  controls.update();
  renderer.render(scene, camera);
}
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* 渲染库失败兜底 */
window.addEventListener('error', (e) => {
  if (e.message && e.message.indexOf('import') !== -1) {
    document.getElementById('fail').style.display = 'flex';
    document.getElementById('loading').style.display = 'none';
  }
}, true);

renderScreen();
animate();
</script>
</body>
</html>
