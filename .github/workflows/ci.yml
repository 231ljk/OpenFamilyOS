name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python 组件（pkg / tools / fosfs）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pytest
      - run: python -m pytest pkg/tests tools/tests fs/fosfs/tests -q

  services:
    name: 用户态服务（C / POSIX）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential systemd-dev
      - run: make -C services all
      - run: make -C services test

  kernel-modules:
    name: 内核模块（modbuild）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential linux-headers-generic
      - run: |
          KDIR=$(ls -d /usr/src/linux-headers-* | head -n1)
          make -C "$KDIR" M="$PWD/kernel" modules
      - run: |
          KDIR=$(ls -d /usr/src/linux-headers-* | head -n1)
          make -C "$KDIR" M="$PWD/kernel" modules_install || true

  # 全源码构建链：Linux 内核 + busybox + 服务 + rootfs + grub ISO
  # 跑通即证明「源码 → 完整可启动操作系统」闭环成立
  build-full-os:
    name: 全源码构建完整 OS（源码→可启动 ISO）
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget bc flex bison libssl-dev \
            libelf-dev cpio xorriso grub-pc-bin grub-efi-ia32-bin grub-efi-amd64-bin \
            mtools systemd-dev
      - name: 从源码构建完整可启动系统
        id: build
        run: |
          set -o pipefail
          ./tools/build-full-os.sh --out out 2>&1 | tee /tmp/build.log
        continue-on-error: true
      - name: 上传诊断日志（无论成败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-full-os-log
          path: /tmp/build.log
          retention-days: 7
      - name: 构建失败则标记
        if: steps.build.outcome == 'failure'
        run: exit 1
      - name: 校验产物
        if: success()
        run: |
          ls -lh out/*.iso out/initramfs.cpio.gz
          file out/*.iso
          test -s out/familyos-open-wheel-*-x86_64.iso
      - name: 上传可启动镜像（验证用）
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: familyos-full-os-iso
          path: out/*.iso
          retention-days: 14
